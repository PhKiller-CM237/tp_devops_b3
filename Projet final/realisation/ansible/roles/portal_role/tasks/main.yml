---
- name: Creer le repertoire du portail
  ansible.builtin.file:
    path: "{{ portal_dir }}"
    state: directory
    mode: "0755"
- name: Generer Compose du portail
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ portal_dir }}/docker-compose.yml"
    mode: "0644"
- name: Demarrer le portail
  community.docker.docker_compose_v2:
    project_src: "{{ portal_dir }}"
    project_name: icgroup-portal
    wait: true
    wait_timeout: 120
- name: Verifier version et liens du portail
  ansible.builtin.uri:
    url: http://127.0.0.1:8095/api/info
    return_content: true
  register: portal_info
  retries: 20
  delay: 2
  until: portal_info.status == 200
  failed_when: portal_info.json.version != portal_version
